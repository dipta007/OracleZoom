[project]
name = "oraclezoom"
version = "1.0.0"
description = "OracleZoom: reference-constrained recursive image super-resolution (4x to 256x)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Versions follow Chain-of-Zoom, whose checkpoints and SD3 pipeline this builds on.
# Newer torch/transformers may work but are untested here.
# Upper bounds are load-bearing, not caution. Verified on a clean H100 box: with
# `transformers>=4.49.0` a fresh install resolves to 5.x, and Chain-of-Zoom's vendored
# code dies with "cannot import name 'apply_chunking_to_forward'". numpy 2.x breaks
# torch builds compiled against 1.x. opencv-python-headless is required because the
# plain wheel needs libxcb/libGL, which servers do not have. pyiqa is pinned because
# its metric internals changed across releases, and unpinning it silently changes the
# reported numbers. Do not bump it past 0.1.15 without checking: 0.1.16 requires
# transformers>=5, which Chain-of-Zoom cannot run on, so the resolve fails outright.
dependencies = [
    "torch>=2.4.1,<2.6",
    "torchvision",
    "diffusers>=0.32.1,<0.33",
    "transformers>=4.49.0,<5",
    "tokenizers<0.22",
    "numpy<2",
    "peft>=0.13",
    "accelerate",
    "safetensors",
    "qwen-vl-utils",
    "pillow",
    "lpips",                    # imported by Chain-of-Zoom's osediff_sd3
    "opencv-python-headless",   # servers lack the X11 libs the plain wheel links against
    "pyiqa==0.1.15",  # metrics: clipiqa, lpips, dists, topiq. Pinned: see REPRODUCE.md
    # CLIPIQA -> pyiqa -> clip -> `from pkg_resources import packaging`. setuptools 81
    # dropped pkg_resources, and uv does not install setuptools by default, so without
    # this CLIPIQA (the headline metric) silently fails while every other metric works.
    "setuptools<81",
    "pyarrow",        # reading parquet test sets (ffhq)
    "datasets",       # pulling the training data from HuggingFace
    "huggingface-hub",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.urls]
Homepage = "https://dipta007.github.io/OracleZoom/"
Repository = "https://github.com/dipta007/OracleZoom"
Model = "https://huggingface.co/dipta007/OracleZoom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opd_zoom"]

[tool.ruff]
line-length = 100
target-version = "py310"
