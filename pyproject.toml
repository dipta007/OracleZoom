[project]
name = "oraclezoom"
version = "1.0.0"
description = "OracleZoom: privileged-latent distillation for extreme super-resolution (4x to 256x)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Versions follow Chain-of-Zoom, whose checkpoints and SD3 pipeline this builds on.
# Newer torch/transformers may work but are untested here.
dependencies = [
    "torch>=2.4.1",
    "torchvision",
    "diffusers>=0.32.1",
    "transformers>=4.49.0",
    "peft>=0.13",
    "accelerate",
    "safetensors",
    "qwen-vl-utils",
    "pillow",
    "pyiqa",          # metrics: clipiqa, lpips, dists, topiq. PIN this, see REPRODUCE.md
    "pyarrow",        # reading parquet test sets (ffhq)
    "datasets",       # pulling the training data from HuggingFace
    "huggingface-hub",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.urls]
Homepage = "https://XXXX.github.io/OracleZoom/"
Repository = "https://github.com/XXXX/OracleZoom"
Model = "https://huggingface.co/XXXX/OracleZoom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opd_zoom"]

[tool.ruff]
line-length = 100
target-version = "py310"
